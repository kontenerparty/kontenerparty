<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kontener Party</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="left">

        <!-- Napis -->
        <img src="assets/kontener.svg" id="kontener" alt="Kontener">

        <!-- Duże logo w tle -->
        <img src="assets/logo.svg" id="logo-bg" alt="">

        <!-- Licznik -->
        <div id="timer">

            <div class="line">
                <span id="days">0</span>
                <span>dni</span>
            </div>

            <div class="line">
                <span id="hours">0</span>
                <span>godzin</span>
            </div>

            <div class="line">
                <span id="minutes">0</span>
                <span>minut</span>
            </div>

            <div class="line">
                <span id="seconds">0</span>
                <span>sekund</span>
            </div>

        </div>

        <!-- Menu -->
        <nav>

            <a href="https://open.spotify.com/playlist/2KBiEhjZrDIFb5QY5lhxzC?si=49e53e3b5d6e4743&pt=a704a1233e445b93553c190907c87d87" target="_blank" rel="noopener noreferrer">
                PLAYLISTA
            </a>

            <a href="https://docs.google.com/spreadsheets/d/1u6o7Pnl3MUOI4zKPGg9LCcN33bQdhCjYazGk2YQAc_k/edit?usp=sharing" target="_blank" rel="noopener noreferrer">
                LISTA ZAKUPÓW
            </a>

            <a href="https://drive.google.com/drive/folders/1QVq7OCGiF6-hMOSW-tcxd2chWg0xD9Gw?usp=sharing" target="_blank" rel="noopener noreferrer">
                POPRZEDNIE EDYCJE
            </a>

            <a href="tel:+48792197080">
                KONTAKT
            </a>

        </nav>

        <!-- Logo w lewym dolnym rogu -->
        <img src="assets/logo.svg" id="logo" alt="Logo">

    </div>

    <div class="right">

        <img src="assets/background.jpg" id="background" alt="Tło">

    </div>

    <script src="script.js"></script>

</body>

</html>
